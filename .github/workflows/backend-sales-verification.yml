name: Backend Sales Verification

on:
  pull_request:
    branches:
      - dev
      - general
      - javitfg
  push:
    branches:
      - dev
      - general
      - javitfg
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sales-verification:
    name: Sales Verification Suite
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:9.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stock_manager
          MYSQL_USER: nuv-tfg
          MYSQL_PASSWORD: '0000'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/stock_manager
      TEST_DB_USER: nuv-tfg
      TEST_DB_PASSWORD: '0000'
      TEST_JWT_SECRET: ci-jwt-secret-for-sales-verification-tests-32chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ensure Maven wrapper executable
        run: chmod +x mvnw

      - name: Run sales verification tests
        run: ./mvnw -q test -Dgroups=sales-verification -DexcludedGroups=sales-smoke

  sales-smoke:
    name: Sales Smoke Suite
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:9.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stock_manager
          MYSQL_USER: nuv-tfg
          MYSQL_PASSWORD: '0000'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/stock_manager
      TEST_DB_USER: nuv-tfg
      TEST_DB_PASSWORD: '0000'
      TEST_JWT_SECRET: ci-jwt-secret-for-sales-smoke-tests-32chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ensure Maven wrapper executable
        run: chmod +x mvnw

      - name: Run sales smoke tests
        run: ./mvnw -q test -Dgroups=sales-smoke
