spring:
  application:
    name: tfg-rs
  config:
    import: optional:file:.env[.properties]

  docker:
    compose:
      file: ../nuv-tfg-infra/docker-compose.yml
      lifecycle-management: start-and-stop

  datasource:
    url: jdbc:mysql://localhost:3306/stock_manager
    username: ${DB_USER:${MYSQL_USER:nuv-tfg}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:0000}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}

google:
  client-id: ${GOOGLE_CLIENT_ID}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

auth:
  debug:
    google: ${AUTH_DEBUG_GOOGLE:true}
  role-switch:
    enabled: ${AUTH_ROLE_SWITCH_ENABLED:true}

rate-limit:
  auth:
    login:
      capacity: ${RATE_LIMIT_AUTH_LOGIN_CAPACITY:10}
      refill-tokens: ${RATE_LIMIT_AUTH_LOGIN_REFILL_TOKENS:10}
      refill-seconds: ${RATE_LIMIT_AUTH_LOGIN_REFILL_SECONDS:60}
    register:
      capacity: ${RATE_LIMIT_AUTH_REGISTER_CAPACITY:5}
      refill-tokens: ${RATE_LIMIT_AUTH_REGISTER_REFILL_TOKENS:5}
      refill-seconds: ${RATE_LIMIT_AUTH_REGISTER_REFILL_SECONDS:60}

analytics:
  seed:
    enabled: ${ANALYTICS_SEED_ENABLED:false}

logging:
  level:
    com.nuv.tfgrs.controller.AuthController: DEBUG
    com.nuv.tfgrs.service.impl.AuthServiceImpl: DEBUG
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
    org.flywaydb.core.internal.database.base.Database: ERROR
