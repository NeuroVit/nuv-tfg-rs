spring:
  application:
    name: tfg-rs
  config:
    import: optional:file:.env[.properties]

  docker:
    compose:
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
      file: ${SPRING_DOCKER_COMPOSE_FILE:../nuv-tfg-infra/docker-compose.yml}
      lifecycle-management: ${SPRING_DOCKER_COMPOSE_LIFECYCLE:start-and-stop}

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stock_manager}}}
    username: ${DB_USER:${MYSQL_USER:nuv-tfg}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:0000}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: llama3.2

server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:NATIVE}
  error:
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
  refresh-cookie-samesite: ${JWT_REFRESH_COOKIE_SAMESITE:Lax}

google:
  client-id: ${GOOGLE_CLIENT_ID:test-google-client-id}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  allowed-client-ids: ${GOOGLE_ALLOWED_CLIENT_IDS:}
  mobile:
    callback-url: ${GOOGLE_MOBILE_CALLBACK_URL:http://localhost:8080/api/auth/google/mobile/callback}
    default-deep-link: ${GOOGLE_MOBILE_DEEP_LINK:neurovit://auth/google/callback}
    allowed-deep-link-prefixes: ${GOOGLE_MOBILE_ALLOWED_DEEP_LINK_PREFIXES:neurovit://}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,tauri://localhost,http://tauri.localhost,https://tauri.localhost,https://web-production-b34f68.up.railway.app}
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:tauri://*,http://tauri.localhost,https://tauri.localhost,https://*.up.railway.app}

auth:
  debug:
    google: ${AUTH_DEBUG_GOOGLE:true}
  role-switch:
    enabled: ${AUTH_ROLE_SWITCH_ENABLED:false}

rate-limit:
  auth:
    login:
      capacity: ${RATE_LIMIT_AUTH_LOGIN_CAPACITY:10}
      refill-tokens: ${RATE_LIMIT_AUTH_LOGIN_REFILL_TOKENS:10}
      refill-seconds: ${RATE_LIMIT_AUTH_LOGIN_REFILL_SECONDS:60}
    register:
      capacity: ${RATE_LIMIT_AUTH_REGISTER_CAPACITY:5}
      refill-tokens: ${RATE_LIMIT_AUTH_REGISTER_REFILL_TOKENS:5}
      refill-seconds: ${RATE_LIMIT_AUTH_REGISTER_REFILL_SECONDS:60}
    google-verify:
      capacity: ${RATE_LIMIT_AUTH_GOOGLE_VERIFY_CAPACITY:10}
      refill-tokens: ${RATE_LIMIT_AUTH_GOOGLE_VERIFY_REFILL_TOKENS:10}
      refill-seconds: ${RATE_LIMIT_AUTH_GOOGLE_VERIFY_REFILL_SECONDS:60}
    refresh:
      capacity: ${RATE_LIMIT_AUTH_REFRESH_CAPACITY:30}
      refill-tokens: ${RATE_LIMIT_AUTH_REFRESH_REFILL_TOKENS:30}
      refill-seconds: ${RATE_LIMIT_AUTH_REFRESH_REFILL_SECONDS:60}
    change-password:
      capacity: ${RATE_LIMIT_AUTH_CHANGE_PASSWORD_CAPACITY:5}
      refill-tokens: ${RATE_LIMIT_AUTH_CHANGE_PASSWORD_REFILL_TOKENS:5}
      refill-seconds: ${RATE_LIMIT_AUTH_CHANGE_PASSWORD_REFILL_SECONDS:300}
    google-mobile-credential:
      capacity: ${RATE_LIMIT_AUTH_GOOGLE_MOBILE_CREDENTIAL_CAPACITY:20}
      refill-tokens: ${RATE_LIMIT_AUTH_GOOGLE_MOBILE_CREDENTIAL_REFILL_TOKENS:20}
      refill-seconds: ${RATE_LIMIT_AUTH_GOOGLE_MOBILE_CREDENTIAL_REFILL_SECONDS:60}

analytics:
  seed:
    enabled: ${ANALYTICS_SEED_ENABLED:false}

logging:
  level:
    com.nuv.tfgrs.controller.AuthController: ${LOG_LEVEL_AUTH_CONTROLLER:INFO}
    com.nuv.tfgrs.service.impl.AuthServiceImpl: ${LOG_LEVEL_AUTH_SERVICE:INFO}
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR
    org.flywaydb.core.internal.database.base.Database: ERROR
